<div class="kb-archive">
  {{ range .Page.RegularPages.GroupByDate "2006" "desc" }}
    <h2 id="year-{{ .Key }}">{{ .Key }} <span class="kb-count">{{ len .Pages }} 篇</span></h2>
    <ul class="kb-archive-list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ end }}
</div>
